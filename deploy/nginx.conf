# nginx রিভার্স প্রক্সি — ডোমেইন থেকে ড্যাশবোর্ডে পাঠায়।
# setup_ubuntu.sh নিজে YOUR_DOMAIN বদলে /etc/nginx/sites-available/-এ বসায়; certbot পরে HTTPS যোগ করে।
server {
    listen 80;
    server_name YOUR_DOMAIN;

    client_max_body_size 50m;  # CSV আপলোডের জন্য

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;

        # Streamlit WebSocket ব্যবহার করে — এই দুটি লাইন না থাকলে পেজ লোড হয়ে আটকে থাকবে
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_buffering off;
    }
}
